services:
  app:
    build: .
    env_file: .env.docker
    volumes:
      - storage_data:/var/www/html/storage
      - public_data:/var/www/html/public
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - public_data:/var/www/html/public:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: myschool
      MYSQL_USER: myschool
      MYSQL_PASSWORD: ${DB_PASSWORD:-rahasia-lokal}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rahasia-root-lokal}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prahasia-root-lokal"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
  storage_data:
  public_data: